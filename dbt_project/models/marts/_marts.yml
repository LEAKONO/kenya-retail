version: 2

models:
  - name: dim_product
    description: One row per product, with its category name attached.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_name
        data_tests: [not_null]

  - name: dim_store
    description: One row per shop.
    columns:
      - name: store_key
        data_tests: [unique, not_null]
      - name: store_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: One row per calendar day from 2022 to 2026.
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: full_date
        data_tests: [unique]

  - name: dim_customer
    description: One row per version of a customer (type 2), plus a walk-in row.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: person_id
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]

  - name: fact_sales
    description: One row per order line.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'delivered', 'cancelled', 'refunded','returned']
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['in_store', 'online']

  - name: fact_payments
    description: One row per payment attempt, including failed ones.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: method
        data_tests:
          - accepted_values:
              arguments:
                values: ['mpesa', 'card', 'cash']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed']
      - name: amount
        data_tests: [not_null]

  - name: fact_deliveries
    description: One row per delivery of an online order.
    columns:
      - name: delivery_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: promised_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: delivered_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: carrier
        data_tests:
          - accepted_values:
              arguments:
                values: ['Carrier A', 'Carrier B', 'Carrier C']

  - name: fact_reviews
    description: One row per customer review of an order.
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
